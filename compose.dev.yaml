# 開発とテスト用の PostgreSQL。ほかの PostgreSQL と重ならないよう、DEV_PG_PORT（既定 55433）で公開する。
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DEV_PG_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
